name: CI/CD — Mini Chat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # JOB 1 : Test Backend
  # ─────────────────────────────────────────
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Validate server syntax
        run: node --check server.js

  # ─────────────────────────────────────────
  # JOB 2 : Test Frontend
  # ─────────────────────────────────────────
  test-frontend:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML exists
        run: |
          test -f frontend/index.html && echo "✅ index.html found" || (echo "❌ index.html missing" && exit 1)

      - name: Check HTML structure
        run: |
          grep -q "api/messages" frontend/index.html && echo "✅ API calls present" || (echo "❌ API calls missing" && exit 1)
          grep -q "pseudoInput" frontend/index.html  && echo "✅ Pseudo input present" || (echo "❌ Pseudo input missing" && exit 1)

  # ─────────────────────────────────────────
  # JOB 3 : Build Docker images
  # ─────────────────────────────────────────
  build-docker:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t chat-backend ./backend

      - name: Build frontend image
        run: docker build -t chat-frontend ./frontend

      - name: Smoke test backend container
        run: |
          docker run -d --name backend-test -p 3001:3001 chat-backend
          sleep 3
          curl -f http://localhost:3001/health || (docker logs backend-test && exit 1)
          docker stop backend-test

  # ─────────────────────────────────────────
  # JOB 4 : Deploy Frontend → Vercel
  # ─────────────────────────────────────────
  deploy-frontend:
    name: 🚀 Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          cd frontend
          vercel --token ${{ secrets.VERCEL_TOKEN }} \
                 --prod \
                 --yes \
                 --name tp-exam-chat-frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─────────────────────────────────────────
  # JOB 5 : Deploy Backend → Render
  # (Render se redéploie automatiquement via webhook)
  # ─────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Render deploy triggered"
