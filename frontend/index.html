<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💬 Mini Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .chat-container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 700px;
      overflow: hidden;
    }

    /* HEADER */
    .chat-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .avatar {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .chat-header h1 { font-size: 1.3rem; font-weight: 700; }
    .chat-header p { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }
    .status-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* PSEUDO ZONE */
    .pseudo-zone {
      background: #f8f7ff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pseudo-zone label { font-size: 0.85rem; color: #6b7280; white-space: nowrap; }
    .pseudo-zone input {
      flex: 1;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .pseudo-zone input:focus { border-color: #667eea; }

    /* MESSAGES */
    .messages-zone {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fafafa;
    }
    .messages-zone::-webkit-scrollbar { width: 4px; }
    .messages-zone::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.mine { align-self: flex-end; align-items: flex-end; }
    .message.other { align-self: flex-start; align-items: flex-start; }

    .message-meta {
      font-size: 0.72rem;
      color: #9ca3af;
      margin-bottom: 4px;
      display: flex;
      gap: 6px;
    }
    .message-meta .author { font-weight: 600; color: #6b7280; }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.45;
      word-break: break-word;
    }
    .mine .bubble {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .other .bubble {
      background: #fff;
      color: #1f2937;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }
    .system .bubble {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      font-style: italic;
      font-size: 0.82rem;
    }
    .system { align-self: center; align-items: center; max-width: 90%; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      gap: 8px;
    }
    .empty-state .icon { font-size: 3rem; }

    /* INPUT ZONE */
    .input-zone {
      padding: 16px 20px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
    }
    .input-zone input {
      flex: 1;
      border: 1.5px solid #d1d5db;
      border-radius: 25px;
      padding: 10px 18px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-zone input:focus { border-color: #667eea; }
    .input-zone button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px; height: 44px;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }
    .input-zone button:hover { transform: scale(1.08); }
    .input-zone button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* REFRESH indicator */
    .refresh-bar {
      text-align: center;
      font-size: 0.72rem;
      color: #9ca3af;
      padding: 4px;
      background: #f9fafb;
      border-top: 1px solid #f3f4f6;
    }

    @media (max-width: 480px) {
      .chat-container { height: 100vh; border-radius: 0; max-height: none; }
      body { padding: 0; }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- Header -->
  <div class="chat-header">
    <div class="avatar">💬</div>
    <div>
      <h1>Mini Chat</h1>
      <p><span class="status-dot"></span>En ligne · actualisation auto</p>
    </div>
  </div>

  <!-- Pseudo -->
  <div class="pseudo-zone">
    <label>👤 Pseudo :</label>
    <input type="text" id="pseudoInput" placeholder="Entrez votre pseudo..." maxlength="30" />
  </div>

  <!-- Messages -->
  <div class="messages-zone" id="messagesZone">
    <div class="empty-state" id="emptyState">
      <div class="icon">💭</div>
      <p>Aucun message pour l'instant</p>
      <p style="font-size:0.8rem">Soyez le premier à écrire !</p>
    </div>
  </div>

  <div class="refresh-bar" id="refreshBar">Chargement…</div>

  <!-- Input -->
  <div class="input-zone">
    <input type="text" id="messageInput" placeholder="Écrivez un message…" maxlength="500" />
    <button id="sendBtn" title="Envoyer">➤</button>
  </div>
</div>

<script>
  // ⚠️ REMPLACE cette URL par ton URL Render après déploiement
  const API_URL = 'https://tp-exam-chat-ma0y.onrender.com';

  const pseudoInput   = document.getElementById('pseudoInput');
  const messageInput  = document.getElementById('messageInput');
  const sendBtn       = document.getElementById('sendBtn');
  const messagesZone  = document.getElementById('messagesZone');
  const emptyState    = document.getElementById('emptyState');
  const refreshBar    = document.getElementById('refreshBar');

  let lastMessageCount = 0;
  let isSending = false;

  // Sauvegarde du pseudo
  const savedPseudo = localStorage.getItem('chatPseudo');
  if (savedPseudo) pseudoInput.value = savedPseudo;
  pseudoInput.addEventListener('input', () => {
    localStorage.setItem('chatPseudo', pseudoInput.value);
  });

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  async function fetchMessages() {
    try {
      const res = await fetch(`${API_URL}/api/messages`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const msgs = await res.json();

      if (msgs.length !== lastMessageCount) {
        renderMessages(msgs);
        lastMessageCount = msgs.length;
      }

      const now = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      refreshBar.textContent = `✅ Dernière mise à jour : ${now} · actualisation dans 4s`;
    } catch (err) {
      refreshBar.textContent = `⚠️ Erreur de connexion — ${err.message}`;
    }
  }

  function renderMessages(msgs) {
    const myPseudo = pseudoInput.value.trim();
    const wasAtBottom = messagesZone.scrollHeight - messagesZone.scrollTop <= messagesZone.clientHeight + 60;

    // Vider sauf empty state
    while (messagesZone.firstChild) messagesZone.removeChild(messagesZone.firstChild);

    if (msgs.length === 0) {
      messagesZone.appendChild(emptyState);
      return;
    }

    msgs.forEach(msg => {
      const isSystem = msg.author === 'System';
      const isMine   = !isSystem && myPseudo && msg.author === myPseudo;

      const wrapper = document.createElement('div');
      wrapper.className = 'message ' + (isSystem ? 'system' : isMine ? 'mine' : 'other');

      if (!isSystem) {
        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.innerHTML = `<span class="author">${escHtml(msg.author)}</span><span>${formatTime(msg.timestamp)}</span>`;
        wrapper.appendChild(meta);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = msg.content;
      wrapper.appendChild(bubble);

      messagesZone.appendChild(wrapper);
    });

    if (wasAtBottom || lastMessageCount === 0) {
      messagesZone.scrollTop = messagesZone.scrollHeight;
    }
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendMessage() {
    if (isSending) return;
    const author  = pseudoInput.value.trim();
    const content = messageInput.value.trim();

    if (!author) { pseudoInput.focus(); pseudoInput.style.borderColor = '#ef4444'; setTimeout(() => pseudoInput.style.borderColor = '', 1500); return; }
    if (!content) { messageInput.focus(); return; }

    isSending = true;
    sendBtn.disabled = true;

    try {
      const res = await fetch(`${API_URL}/api/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ author, content })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      messageInput.value = '';
      await fetchMessages();
    } catch (err) {
      alert('Erreur envoi : ' + err.message);
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      messageInput.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

  // Premier chargement + auto-refresh toutes les 4 secondes
  fetchMessages();
  setInterval(fetchMessages, 4000);
</script>
</body>
</html>
